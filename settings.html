<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Настройки бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050607; --card:#0b1111; --card2:#070b0b; --line:#1d2a2a; --line2:#141c1c; --chip:#12201f;
  --text:#eef2f2; --hint:#8a9696; --dim:#6b7878; --mute:#4b5858;
  --acc:#2dd4bf; --acc-l:#5eead4; --acc-xl:#ccfbf1; --acc-ink:#032622;
  --bad:#f87171; --bad-l:#fca5a5; --warn:#fbbf24;
  --hd:"Space Grotesk",Inter,system-ui,sans-serif;
  --rgb:45,212,191; --pill:#99f6e4; --hline:#16312e; --hbg:#070b0b;
  --glow:rgba(var(--rgb),.45); --glow2:transparent;
  --mk:linear-gradient(135deg,#5eead4,#2dd4bf);
}
/* Своя стилистика под сеть: меняется сразу, как выбираешь сеть на главной */
:root[data-theme="sol"]{
  --bg:#07050d; --card:#0e0b17; --card2:#09070f; --line:#241d3a; --line2:#17122a; --chip:#1b1430;
  --acc:#14f195; --acc-l:#5ff7b6; --acc-xl:#d4fde9; --acc-ink:#03210f; --rgb:20,241,149;
  --pill:#c4a5ff; --hline:#2f2356; --hbg:#09060f; --hint:#9690a8; --dim:#78718c; --mute:#4f4866;
  --glow:rgba(153,69,255,.6); --glow2:rgba(20,241,149,.32);
  --mk:linear-gradient(135deg,#b07cff 10%,#7a5cff 45%,#14f195 90%);
}
:root[data-theme="bsc"]{
  --bg:#070604; --card:#12100a; --card2:#0b0906; --line:#2c2513; --line2:#1d180d; --chip:#251e0b;
  --acc:#f0b90b; --acc-l:#f8d14a; --acc-xl:#fdf0c4; --acc-ink:#1f1600; --rgb:240,185,11;
  --pill:#f8d14a; --hline:#3d3112; --hbg:#0a0805; --hint:#9a927e; --dim:#7d7563; --mute:#544d3d;
  --glow:rgba(240,185,11,.42); --glow2:rgba(240,185,11,.12);
  --mk:linear-gradient(135deg,#ffe27a,#f0b90b 60%,#c98f00);
}
:root[data-theme="rh"]{
  --bg:#030a06; --card:#08140d; --card2:#050e09; --line:#163323; --line2:#0f2418; --chip:#0e2717;
  --acc:#3ee07a; --acc-l:#7aeea6; --acc-xl:#d9fbe6; --acc-ink:#032712; --rgb:62,224,122;
  --pill:#e7c97e; --hline:#1f4a32; --hbg:#04100a; --hint:#8aa597; --dim:#6b8778; --mute:#47604f;
  --glow:rgba(30,150,80,.55); --glow2:rgba(214,180,106,.28);
  --mk:linear-gradient(135deg,#7aeea6,#3ee07a 50%,#e7c97e);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
html,body{transition:background-color .35s;margin:0;background:var(--bg);color:var(--text);font:15px/1.38 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:18px 16px 170px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .tt{flex:1;min-width:0}
.h1{font-family:var(--hd);font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hint);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.dot.busy{background:var(--warn)}
.pill{position:relative;height:38px;border-radius:999px;color:var(--pill);padding:0 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;max-width:48%}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero{position:relative;border-radius:26px;border:1px solid var(--hline);background:var(--hbg);overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.hero .glow{position:absolute;inset:0;background-image:radial-gradient(ellipse 55% 60% at 85% 0%,var(--glow),transparent 70%),radial-gradient(ellipse 45% 40% at 10% 100%,var(--glow2),transparent 70%)}
.hero .mark{position:absolute;right:-34px;top:-30px;font-family:var(--hd);font-size:150px;font-weight:700;letter-spacing:-6px;line-height:1;white-space:nowrap;background:var(--mk);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-mask-image:linear-gradient(200deg,#000 20%,rgba(0,0,0,.35) 55%,transparent 82%);mask-image:linear-gradient(200deg,#000 20%,rgba(0,0,0,.35) 55%,transparent 82%);pointer-events:none;user-select:none}
.hero .dots{position:absolute;inset:0;background-image:radial-gradient(circle,transparent 1px,var(--hbg) 1.6px);background-size:5px 5px}
.hero>*:not(.glow):not(.dots):not(.mark){position:relative}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--acc-l)}
.big{font-family:var(--hd);font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:0 0 auto}
.rowlbl{font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--dim);margin-bottom:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--hint);font-size:12.5px;white-space:nowrap}
.chip.on{border-color:var(--acc);background:rgba(var(--rgb),.14);color:var(--acc-xl);font-weight:600}
.vsep{width:1px;background:var(--line);align-self:stretch}
.cta{height:52px;border-radius:16px;border:0;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta.ghost{background:var(--card);border:1px solid var(--line);color:var(--acc-l);font-weight:600;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{text-align:left;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:3px}
.tile .a{font-size:11.5px;color:var(--hint)}
.tile .b{font-family:var(--hd);font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c{font-size:11.5px;color:var(--acc-l)}
.tile.bad .b{color:var(--bad-l)}
.list{border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc-l)}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column}
.li .t b{font-size:14.5px;font-weight:600}
.li .t span{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute)}
.sec{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--dim);margin:16px 4px 8px;display:flex;justify-content:space-between}
.sec i{font-style:normal;font-weight:500;letter-spacing:0;color:var(--acc-l)}
.sdesc{font-size:12.5px;color:var(--hint);margin:-4px 4px 8px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px 4px}
.subtabs::-webkit-scrollbar{display:none}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.row{position:relative;padding:14px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row.ch::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.rh{display:flex;align-items:center;gap:12px}
.rl{flex:1;min-width:0}
.rl b{display:block;font-size:15px;font-weight:700}
.rl span{display:block;font-size:12px;color:var(--hint);margin-top:1px}
.was{font-size:12px;color:var(--acc-l);margin-top:6px}
.warn{font-size:12px;color:var(--warn);margin-top:6px}
.warn.bad{color:var(--bad-l)}
.fld{height:44px;min-width:0;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:6px;font-size:12px;color:var(--dim);white-space:nowrap}
.fld:focus-within{border-color:var(--acc)}
.fld.err{border-color:var(--bad)}
.fld input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:15px;font-weight:600;text-align:right;outline:none;padding:0}
.fld input::placeholder{color:#55625f;font-weight:400}
.one{width:112px;flex-shrink:0}
.two{display:flex;align-items:center;gap:8px;margin-top:10px}
.two .fld{flex:1 1 0}
.two .dash{color:var(--mute)}
.bigv{font-family:var(--hd);font-size:20px;font-weight:700;color:var(--acc-l);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:10px 0 2px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) 0 var(--p,0%),#1a2423 var(--p,0%) 100%)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#1a2423}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
.seg{display:flex;padding:3px;gap:3px;border-radius:13px;background:var(--card2);border:1px solid var(--line);margin-top:10px}
.seg button{flex:1;height:36px;border-radius:10px;border:0;background:none;color:var(--hint);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--chip);color:var(--acc-xl);font-weight:700}
.sw{position:relative;width:50px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:#1d2a2a;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(20px)}
.swt{font-size:12.5px;color:var(--hint)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pc{padding:14px 16px;border-bottom:1px solid var(--line2)}
.pc:last-child{border-bottom:0}
.pc .pt{display:flex;align-items:center;gap:8px}
.pc .nm{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--acc);color:var(--acc-xl);background:rgba(var(--rgb),.12);white-space:nowrap}
.badge.del{border-color:var(--bad);color:var(--bad-l);background:rgba(248,113,113,.1)}
.pc .sm{font-size:12.5px;color:var(--hint);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{height:36px;border-radius:11px;padding:0 13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:13px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.red{border-color:#3d2422;color:var(--bad-l);background:#150c0b}
.ti{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;padding:0 12px;outline:none}
.ti:focus{border-color:var(--acc)}
.irow{display:flex;gap:8px;align-items:center;width:100%}
.ferr{font-size:12.5px;color:var(--bad-l);margin-top:6px}
.empty{padding:60px 18px;text-align:center;color:var(--hint)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.dock>*{pointer-events:auto}
.dockin{max-width:560px;margin:0 auto;padding:0 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.abar{display:none;gap:8px}
.abar.on{display:flex}
.abar .cta{height:50px;white-space:nowrap;font-size:15px}
.nav{height:62px;border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:5px}
.nav button{position:relative;height:50px;border-radius:17px;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px}
.nav button.on{background:var(--chip);color:var(--acc-l);font-weight:600}
.nav .n{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--acc);color:var(--acc-ink);font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
.glass{background:rgba(14,21,21,.78);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.11);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 18px 50px rgba(0,0,0,.5)}
.pk{padding:6px}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:0;border-radius:16px;background:none;text-align:left}
.pkrow.on{background:rgba(var(--rgb),.14)}
.pkrow .t{flex:1;min-width:0}
.pkrow .t b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkrow .t span{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pkrow .ck{color:var(--acc);opacity:0;flex-shrink:0}
.pkrow.on .ck{opacity:1}
.pkrow+.pkrow{border-top:1px solid rgba(255,255,255,.055)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.fldw{width:100%;margin-top:10px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sh{border-bottom:0;background:rgba(12,18,18,.9);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h2{font-family:var(--hd);font-size:21px;margin:0 0 4px}
.sh .d{font-size:12.5px;color:var(--hint);margin-bottom:12px}
.ci{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.ci:last-child{border-bottom:0}
.ci .o{color:var(--dim);text-decoration:line-through;margin-right:6px}
.ci .n{color:var(--acc-l);font-weight:600}
.shb{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="dock"><div class="dockin">
  <div class="abar" id="abar"><button class="cta ghost" id="bfind" style="width:auto;padding:0 16px">Найти токены</button><button class="cta" id="bsave"></button></div>
  <nav class="nav glass" id="nav"></nav>
</div></div>
<div class="sheet" id="sheet"><div class="sh glass" id="sh"></div></div>

  return topHTML("Настройки") + `
  <div class="hero"><div class="glow"></div>${tick ? `<div class="mark" aria-hidden="true">${esc(tick)}</div>` : ""}<div class="dots"></div>
    <div><div class="lbl">ГДЕ ИЩЕМ</div><div class="big">${esc(cName)} · ${esc(String(cur["m.period"]).replace("h", "ч"))}</div></div>
    <div><div class="rowlbl">СЕТЬ</div><div class="chips">${chains.map(([v, l]) => `<button class="chip${cur["m.chain"] === v ? " on" : ""}" data-s="m.chain" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>
    <div><div class="rowlbl">ПЕРИОД</div><div class="chips">${periods.map(([v, l]) => `<button class="chip${cur["m.period"] === v ? " on" : ""}" data-s="m.period" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>
    <button class="cta" data-act="find">${svg("search")}Найти токены</button>
  </div>
  <div class="tiles">
    <button class="tile" data-go="filters"><span class="a">Фильтры</span><span class="b">${nf}</span><span class="c">активно ›</span></button>
    <button class="tile${gas > 1 ? " bad" : ""}" data-go="more" data-to="strat_gas_usd"><span class="a">Газ</span><span class="b">$${fmtN(gas)}</span><span class="c">издержки ›</span></button>
    <button class="tile" data-go="more" data-to="excel_cards_max"><span class="a">Досье</span><span class="b">${num(cur.excel_cards_max) || "выкл"}</span><span class="c">Excel ›</span></button>
  </div>
  <div class="list">
    <button class="li" data-go="presets"><span class="ic">${svg("layers")}</span><span class="t"><b>Пресеты</b><span>${Object.keys(P.ps || {}).length} сохранено · ${esc(sel ? "выбран " + (renames[sel] || sel) : "пресет не выбран")}</span></span><span class="chev">›</span></button>
    <button class="li" data-go="more" data-to="sol_pumpfun"><span class="ic">${svg("coins")}</span><span class="t"><b>Площадки и капа токенов</b><span>${esc(plat)} · капа ${esc(valText("min_token_market_cap", cur.min_token_market_cap))}–${esc(valText("max_token_market_cap", cur.max_token_market_cap))}</span></span><span class="chev">›</span></button>
    <button class="li" data-go="more" data-to="strat_slip_in_pct"><span class="ic">${svg("chart")}</span><span class="t"><b>Поиск стратегии</b><span>издержки копировщика</span></span><span class="chev">›</span></button>
  </div>`;
}
function filtersHTML(){
  if (!fsub) fsub = FILTER_GROUPS[0] && FILTER_GROUPS[0].t;
  const g = FILTER_GROUPS.find(x => x.t === fsub) || FILTER_GROUPS[0];
  const name = t => t.replace(/^\S+\s/, "");
  return topHTML("Фильтры", true) + `<div class="subtabs">${FILTER_GROUPS.map(x => { const c = groupCount(x);
      return `<button class="chip${x.t === g.t ? " on" : ""}" data-sub="${esc(x.t)}">${esc(name(x.t))}${c ? ` · ${c}` : ""}</button>`; }).join("")}</div>` + groupHTML(g, activeIn(g) ? activeIn(g) + " активно" : "");
}
function moreHTML(){ return topHTML("Ещё", true) + MORE_GROUPS.map(g => groupHTML(g, "")).join(""); }
function presetSummary(v){
  const parts = [];
  if (num(v.min_pnl_usd)) parts.push("PnL от " + money(v.min_pnl_usd));
  if (num(v.min_winrate_pct)) parts.push("WR от " + fmtN(v.min_winrate_pct) + "%");
  if (num(v.min_tokens_traded) || num(v.max_tokens_traded)) parts.push("токенов " + (fmtN(v.min_tokens_traded) || "0") + "–" + (num(v.max_tokens_traded) ? fmtN(v.max_tokens_traded) : "∞"));
  if (num(v.cc_max_mc)) parts.push("капа до " + money(v.cc_max_mc));
  return parts.join(" · ") || "без ограничений";
}
function presetsHTML(){
  const names = Object.keys(P.ps || {});
  let h = topHTML("Пресеты", true) + `<div class="sec">СОХРАНИТЬ ТЕКУЩИЕ КАК НОВЫЙ</div><div class="card"><div class="pc">
    <input class="ti" id="saname" maxlength="40" placeholder="например, sol1 v3" value="${esc(saveAsName)}" aria-label="Название нового пресета">
    <div class="sm">Сохранится вместе с остальными изменениями.</div><div class="ferr" id="saerr" style="display:none"></div></div></div>
    <div class="sec">МОИ ПРЕСЕТЫ<i>${names.length}</i></div><div class="card">`;
  if (!names.length) h += `<div class="pc"><div class="sm">Пока нет ни одного — сохрани текущие настройки как новый.</div></div>`;
  names.forEach(n => {
    const del = ops.some(o => o[0] === "delete" && o[1] === n), ren = renames[n], isCur = sel === n;
    h += `<div class="pc" data-p="${esc(n)}"><div class="pt"><div class="nm"${del ? ' style="text-decoration:line-through;color:var(--dim)"' : ""}>${esc(ren || n)}</div>
      ${isCur ? '<span class="badge">выбран</span>' : ""}${n === P.p && !isCur ? '<span class="badge">сейчас в боте</span>' : ""}${del ? '<span class="badge del">удалится</span>' : ""}${ren ? '<span class="badge">новое имя</span>' : ""}</div>
      <div class="sm">${esc(presetSummary(P.ps[n]))}</div>
      <div class="acts" data-acts="${esc(n)}">${del ? `<button class="btn" data-a="undel">Не удалять</button>`
        : `${isCur ? "" : `<button class="btn pri" data-a="use">Выбрать</button>`}<button class="btn" data-a="ren">Переименовать</button><button class="btn red" data-a="del">Удалить</button>`}</div></div>`;
  });
  return h + `</div>`;
}
function navHTML(){
  const it = [["home", "home", "Главная"], ["filters", "filt", "Фильтры"], ["presets", "layers", "Пресеты"], ["more", "more", "Ещё"]];
  return it.map(([s, i, l]) => { const n = scrCount(s);
    return `<button class="${screen === s ? "on" : ""}" data-go="${s}">${svg(i, 20)}${l}${n ? `<span class="n">${n}</span>` : ""}</button>`; }).join("");
}
const THEME_OF = {sol: "sol", bsc: "bsc", robinhood: "rh"};
function applyTheme(){
  const t = THEME_OF[cur["m.chain"]] || "def";
  if (document.documentElement.dataset.theme === t) return;
  document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try { if (inTG){ tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg); } } catch (e) {}
}
function render(keepScroll){
  applyTheme();
  const y = window.scrollY;
  const html = screen === "filters" ? filtersHTML() : screen === "more" ? moreHTML() : screen === "presets" ? presetsHTML() : homeHTML();
  document.getElementById("app").innerHTML = html;
  updateDock();
  if (keepScroll) window.scrollTo(0, y);
}
function refreshRow(k){
  const r = findRow(k);
  if (screen === "home"){ render(true); return; }
  const el = r && document.querySelector(`[data-row="${r.k}"]`);
  if (el){
    el.classList.toggle("ch", (r.t === "range" ? [r.k, r.k2] : [r.k]).some(x => String(cur[x]) !== String(base[x])));
    el.querySelector("[data-wr]").innerHTML = warnHTML(r);
    el.querySelector("[data-wx]").innerHTML = wasLine(r);
    const big = el.querySelector(`[data-big="${r.k}"]`); if (big) big.textContent = num(cur[r.k]) ? "от " + fmtN(cur[r.k]) + "%" : "любой";
    const sl = el.querySelector(`[data-sl="${r.k}"]`); if (sl && document.activeElement !== sl){ sl.value = num(cur[r.k]); } if (sl) sl.style.setProperty("--p", num(cur[r.k]) + "%");
    el.querySelectorAll(`[data-q="${r.k}"]`).forEach(c => c.classList.toggle("on", Number(c.dataset.v) === num(cur[r.k])));
    const inp = el.querySelector(`input[data-k="${r.k}"]`); if (inp && document.activeElement !== inp && inp.type !== "checkbox") inp.value = num(cur[r.k]) ? String(cur[r.k]) : "";
    const f = el.querySelector(`input[data-k="strat_gas_usd"]`); if (f) f.closest(".fld").classList.toggle("err", num(cur.strat_gas_usd) > 1);
  }
  const pf = document.querySelector('[data-row="sol_pumpfun"] [data-wr]'); if (pf) pf.innerHTML = warnHTML(findRow("sol_pumpfun"));
  document.querySelectorAll("[data-sub]").forEach(b => { const g = FILTER_GROUPS.find(x => x.t === b.dataset.sub), c = groupCount(g); b.textContent = g.t.replace(/^\S+\s/, "") + (c ? ` · ${c}` : ""); });
  updateDock();
}
function updateDock(){
  const n = changeList().length;
  document.getElementById("nav").innerHTML = navHTML();
  const ab = document.getElementById("abar"); ab.classList.toggle("on", n > 0);
  document.getElementById("bsave").textContent = `Сохранить (${n})`;
  document.getElementById("app").style.paddingBottom = n ? "230px" : "170px";
}
function openPicker(){
  const names = Object.keys(P.ps || {});
  const row = (v, name, sub) => `<button class="pkrow${sel === v ? " on" : ""}" data-pv="${esc(v)}"><span class="t"><b>${esc(name)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</span><span class="ck">${svg("check", 20)}</span></button>`;
  document.getElementById("sh").innerHTML = `<div class="grab"></div><h2>Пресет</h2><div class="d">Настройки ниже показываются и сохраняются для выбранного пресета.</div>
    <div class="pk">${row("", "Без пресета", "изменения не пишутся ни в один пресет")}${names.map(n => row(n, renames[n] || n, presetSummary(P.ps[n]))).join("")}</div>
    <div class="shb"><button class="cta ghost" id="cb" style="width:100%">Закрыть</button></div>`;
  picker = true;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("cb").onclick = closeReview;
  if (inTG){ tg.BackButton.show(); tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); }
}
function openReview(kind){
  const list = changeList();
  if (!list.length){ send(kind); return; }
  review = kind;
  document.getElementById("sh").innerHTML = `<h2>${kind === "find" ? "Сохранить и найти токены" : "Сохранить изменения"}</h2>
    <div class="d">Проверь, что меняется${saveAsName ? ` — правки уйдут в новый пресет «${esc(saveAsName)}», старый не изменится` : sel ? ` — запишется в пресет «${esc(renames[sel] || sel)}»` : " — пресет не выбран"}.</div>
    <div class="card">${list.map(([l, o, n]) => `<div class="ci"><span>${esc(l)}</span><span>${o !== null ? `<span class="o">${esc(o)}</span>` : ""}${n !== null ? `<span class="n">${esc(n)}</span>` : ""}</span></div>`).join("")}</div>
    <div class="shb"><button class="cta ghost" id="cb" style="width:auto;padding:0 18px">Назад</button><button class="cta" id="cf">${kind === "find" ? "Сохранить и найти" : "Подтвердить"}</button></div>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("cf").onclick = () => send(kind);
  document.getElementById("cb").onclick = closeReview;
  if (inTG){ tg.BackButton.show(); tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); }
}
function closeReview(){ review = null; picker = false; document.getElementById("sheet").classList.remove("on"); if (inTG) tg.BackButton.hide(); }
function send(kind){
  const out = {v: 3, preset: sel, set: {}, ops: []};
  Object.keys(renames).forEach(o => out.ops.push(["rename", o, renames[o]]));
  ops.forEach(o => out.ops.push(o.slice()));
  changedKeys().forEach(k => { if (!k.startsWith("m.")) out.set[k] = cur[k]; });
  out.m = {chain: cur["m.chain"], period: cur["m.period"]};
  if (saveAsName) out.save_as = saveAsName;
  if (kind === "find") out.run = "find";
  if (inTG && tg.sendData){ tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.sendData(JSON.stringify(out)); }
  else alert(JSON.stringify(out));
}
function pickPreset(name){
  sel = name;
  const keep = {"m.chain": cur["m.chain"], "m.period": cur["m.period"]};
  base = Object.assign({}, start, name && P.ps[name] ? P.ps[name] : {}, {"m.chain": start["m.chain"], "m.period": start["m.period"]});
  cur = Object.assign({}, base, keep);
  render(true);
}
function go(s, to){
  screen = s; render(); window.scrollTo(0, 0);
  if (to){ const el = document.querySelector(`[data-row="${to}"]`); if (el) el.scrollIntoView({block: "center"}); }
}
document.addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]"); if (pk){ openPicker(); return; }
  const pv = e.target.closest("[data-pv]"); if (pv){ pickPreset(pv.dataset.pv); closeReview(); return; }
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go, g.dataset.to); return; }
  const sb = e.target.closest("[data-sub]"); if (sb){ fsub = sb.dataset.sub; render(); return; }
  const ac = e.target.closest("[data-act]"); if (ac){ openReview("find"); return; }
  const s = e.target.closest("[data-s]");
  if (s){
    const k = s.dataset.s, o = optsOf(findRow(k)).find(o => String(o[0]) === s.dataset.v);
    cur[k] = o ? o[0] : s.dataset.v;
    s.parentNode.querySelectorAll(`[data-s="${k}"]`).forEach(b => b.classList.toggle("on", b === s));
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); refreshRow(k); return;
  }
  const q = e.target.closest("[data-q]"); if (q){ cur[q.dataset.q] = Number(q.dataset.v); refreshRow(q.dataset.q); return; }
  const a = e.target.closest("[data-a]");
  if (a){
    const n = a.closest("[data-p]").dataset.p, act = a.dataset.a;
    if (act === "use") pickPreset(n);
    else if (act === "del"){ if (a.dataset.sure){ ops.push(["delete", n]); delete renames[n]; if (sel === n) pickPreset(""); else render(true); } else { a.dataset.sure = "1"; a.textContent = "Точно удалить?"; } }
    else if (act === "undel"){ ops = ops.filter(o => !(o[0] === "delete" && o[1] === n)); render(true); }
    else if (act === "ren"){ const box = a.closest("[data-acts]"); box.innerHTML = `<div class="irow"><input class="ti" maxlength="40" value="${esc(renames[n] || n)}" aria-label="Новое имя"><button class="btn pri" data-a="renok">OK</button></div>`; box.querySelector("input").focus(); }
    else if (act === "renok"){
      const v = a.parentNode.querySelector("input").value.trim();
      const taken = Object.keys(P.ps).filter(x => x !== n).map(x => renames[x] || x);
      if (v && v !== n && !taken.includes(v)) renames[n] = v; else delete renames[n];
      render(true);
    }
  }
});
document.addEventListener("input", e => {
  const i = e.target;
  if (i.id === "saname"){
    const v = i.value.trim(), err = document.getElementById("saerr"), taken = Object.keys(P.ps).map(x => renames[x] || x).includes(v);
    err.style.display = taken ? "" : "none"; err.textContent = taken ? "Такой пресет уже есть — выбери другое имя" : "";
    saveAsName = taken ? "" : v; updateDock(); return;
  }
  if (i.dataset && i.dataset.sl){ cur[i.dataset.sl] = Number(i.value); refreshRow(i.dataset.sl); return; }
  const k = i.dataset && i.dataset.k; if (!k) return;
  if (i.type === "checkbox"){
    cur[k] = i.checked ? 1 : 0;
    const r = findRow(k), sw = document.querySelector(`[data-swt="${k}"]`); if (r && r.on && sw) sw.textContent = i.checked ? r.on : r.off;
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  } else {
    let s = i.value.replace(",", ".").replace(/[^\d.]/g, ""); const p = s.split("."); if (p.length > 2) s = p[0] + "." + p.slice(1).join("");
    if (s !== i.value) i.value = s;
    cur[k] = s === "" || isNaN(Number(s)) ? 0 : Number(s);
  }
  refreshRow(k);
});
document.getElementById("bsave").onclick = () => openReview("save");
document.getElementById("bfind").onclick = () => openReview("find");
document.getElementById("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeReview(); });

P = norm(payload());
if (!P || !P.s){
  document.getElementById("app").innerHTML = '<div class="empty">Открой это окно кнопкой «📱 Настройки» в боте.<br><br>Если открыл ею, а видишь это — отправь боту /app и нажми новую кнопку.</div>';
  document.querySelector(".dock").style.display = "none";
} else {
  start = Object.assign({}, P.s, {"m.chain": (P.m || {}).chain || "sol", "m.period": (P.m || {}).period || "6h"});
  sel = P.p || ""; base = Object.assign({}, start); cur = Object.assign({}, start);
  render();
}
if (tg){
  tg.ready(); tg.expand();
  try { tg.setHeaderColor && tg.setHeaderColor("#050607"); tg.setBackgroundColor && tg.setBackgroundColor("#050607"); } catch (e) {}
  if (inTG) tg.BackButton.onClick(closeReview);
}
</script>
</body>
</html>
