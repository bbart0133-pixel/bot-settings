<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Настройки бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020304; --card:#0b1111; --card2:#070b0b; --line:#1d2a2a; --line2:#141c1c; --chip:#12201f;
  --text:#f7f9f9; --hint:#c3caca; --dim:#aeb5b5; --mute:#889090;
  --acc:#2dd4bf; --acc-l:#5eead4; --acc-xl:#ccfbf1; --acc-ink:#032622;
  --bad:#f87171; --bad-l:#fca5a5; --warn:#fbbf24;
  --hd:Onest,system-ui,sans-serif;
  --rgb:45,212,191; --pill:#99f6e4; --hline:#16312e; --hbg:#040606;
  --glow:rgba(var(--rgb),.45); --glow2:transparent;
  --mk:linear-gradient(135deg,#5eead4,#2dd4bf);
  --g1:#99f6e4; --g2:#2dd4bf; --g3:#0ea5a0;   /* полый заголовок: градиент обводки */
}
/* Своя стилистика под сеть: меняется сразу, как выбираешь сеть на главной */
:root[data-theme="sol"]{
  --bg:#040206; --card:#0e0b17; --card2:#09070f; --line:#241d3a; --line2:#17122a; --chip:#1b1430;
  --acc:#14f195; --acc-l:#5ff7b6; --acc-xl:#d4fde9; --acc-ink:#03210f; --rgb:20,241,149;
  --pill:#c4a5ff; --hline:#2f2356; --hbg:#040308; --hint:#cac7d3; --dim:#b5b2c0; --mute:#8b859a;
  --glow:rgba(153,69,255,.6); --glow2:rgba(20,241,149,.32);
  --mk:linear-gradient(135deg,#b07cff 10%,#7a5cff 45%,#14f195 90%);
  --g1:#b07cff; --g2:#7a5cff; --g3:#14f195;
}
:root[data-theme="bsc"]{
  --bg:#040302; --card:#12100a; --card2:#0b0906; --line:#2c2513; --line2:#1d180d; --chip:#251e0b;
  --acc:#f0b90b; --acc-l:#f8d14a; --acc-xl:#fdf0c4; --acc-ink:#1f1600; --rgb:240,185,11;
  --pill:#f8d14a; --hline:#3d3112; --hbg:#050402; --hint:#cbc8bd; --dim:#b8b3aa; --mute:#8e897f;
  --glow:rgba(240,185,11,.42); --glow2:rgba(240,185,11,.12);
  --mk:linear-gradient(135deg,#ffe27a,#f0b90b 60%,#c98f00);
  --g1:#ffe27a; --g2:#f0b90b; --g3:#d99a00;
}
:root[data-theme="rh"]{
  --bg:#020503; --card:#08140d; --card2:#050e09; --line:#163323; --line2:#0f2418; --chip:#0e2717;
  --acc:#3ee07a; --acc-l:#7aeea6; --acc-xl:#d9fbe6; --acc-ink:#032712; --rgb:62,224,122;
  --pill:#e7c97e; --hline:#1f4a32; --hbg:#020805; --hint:#c3d1ca; --dim:#aebdb5; --mute:#85968b;
  --glow:rgba(30,150,80,.55); --glow2:rgba(214,180,106,.28);
  --mk:linear-gradient(135deg,#7aeea6,#3ee07a 50%,#e7c97e);
  --g1:#b8f7cf; --g2:#3ee07a; --g3:#e7c97e;
}
:root[data-theme="arc"]{
  --bg:#020306; --card:#0a0f1b; --card2:#070b14; --line:#1a2540; --line2:#121a2e; --chip:#111c36;
  --acc:#4d8dff; --acc-l:#86b2ff; --acc-xl:#dbe8ff; --acc-ink:#020c22; --rgb:77,141,255;
  --pill:#9cc0ff; --hline:#1f3363; --hbg:#03050a; --hint:#c4cad5; --dim:#afb5c2; --mute:#868d9b;
  --glow:rgba(77,141,255,.5); --glow2:rgba(120,220,255,.2);
  --mk:linear-gradient(135deg,#9cc0ff,#4d8dff 55%,#78dcff);
  --g1:#c3d8ff; --g2:#4d8dff; --g3:#78dcff;
}
:root[data-theme="ely"]{
  --bg:#040206; --card:#140b17; --card2:#0d070f; --line:#33193a; --line2:#221126; --chip:#2a1231;
  --acc:#e06cf5; --acc-l:#ee9ff9; --acc-xl:#fbe3fe; --acc-ink:#24052b; --rgb:224,108,245;
  --pill:#f0b0fa; --hline:#4a2156; --hbg:#060307; --hint:#d0c7d3; --dim:#bbb1bf; --mute:#918796;
  --glow:rgba(224,108,245,.5); --glow2:rgba(255,160,120,.2);
  --mk:linear-gradient(135deg,#f5b8ff,#e06cf5 55%,#ff9f7a);
  --g1:#f5b8ff; --g2:#e06cf5; --g3:#ff9f7a;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
html,body{transition:background-color .35s;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:18px 16px 170px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .tt{flex:1;min-width:0}
.h1{font-family:var(--hd);font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hint);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.dot.busy{background:var(--warn)}
.pill{position:relative;height:38px;border-radius:999px;color:var(--pill);padding:0 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;max-width:48%}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero{position:relative;border-radius:26px;border:1px solid var(--hline);background:var(--hbg);overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.hero .glow{position:absolute;inset:0;background-image:radial-gradient(ellipse 55% 60% at 85% 0%,var(--glow),transparent 70%),radial-gradient(ellipse 45% 40% at 10% 100%,var(--glow2),transparent 70%)}
.hero .mark{position:absolute;right:-34px;top:-30px;font-family:var(--hd);font-size:150px;font-weight:700;letter-spacing:-6px;line-height:1;white-space:nowrap;background:var(--mk);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-mask-image:linear-gradient(200deg,#000 20%,rgba(0,0,0,.35) 55%,transparent 82%);mask-image:linear-gradient(200deg,#000 20%,rgba(0,0,0,.35) 55%,transparent 82%);pointer-events:none;user-select:none}
.hero .dots{position:absolute;inset:0;background-image:radial-gradient(circle,transparent 1px,var(--hbg) 1.6px);background-size:5px 5px}
.hero>*:not(.glow):not(.dots):not(.mark){position:relative}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--acc-l)}
.big{font-family:var(--hd);font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1}
.ocbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 2px 12px;font-size:12px;color:var(--hint)}
.ocbar span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ocref{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(var(--rgb),.45);background:rgba(var(--rgb),.1);color:var(--acc-l);font:600 13px Onest,system-ui,sans-serif}
.ocref:disabled{opacity:.6}
.wk{padding:14px 14px 12px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-4px 0 12px;font-size:12px;color:var(--hint)}
.lgi{display:inline-flex;align-items:center;gap:6px}
.lgi i{width:9px;height:9px;border-radius:3px;display:inline-block}
.lgi b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.wkc.stk .col{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;gap:2px;opacity:.55;transition:opacity .15s}
.wkc.stk .col i{display:block;min-height:2px;border-radius:0}
.wkc.stk .col i:last-child{border-radius:4px 4px 0 0}
.wkc.stk.on .col{opacity:1}
.wkc.stk.part .col{opacity:.3}
.wkc.stk.part.on .col{opacity:.7}
.wkc.stk .d{font-size:11px;color:var(--dim);line-height:1}
.wkc.stk.on .d{color:var(--text);font-weight:600}
.wkh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wkv{font-family:var(--hd);font-size:22px;font-weight:700;color:var(--text)}
.wkd{font-size:12px;color:var(--hint)}
.wkb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;height:120px;align-items:end}
.wkc{all:unset;cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.wkc i{display:block;width:100%;max-width:44px;border-radius:4px 4px 0 0;background:rgba(var(--rgb),.38);transition:background .15s}
.wkc.on i{background:var(--acc)}
.wkc.part i{background:repeating-linear-gradient(135deg,rgba(var(--rgb),.5) 0 3px,rgba(var(--rgb),.18) 3px 6px)}
.wkc.part.on i{background:repeating-linear-gradient(135deg,var(--acc) 0 3px,rgba(var(--rgb),.45) 3px 6px)}
.wkc span{font-size:11px;color:var(--dim);line-height:1}
.wkc.on span{color:var(--text);font-weight:600}
.wkf{margin-top:10px;font-size:12px;color:var(--hint)}
.hollow{display:block;width:100%;height:46px;overflow:visible;filter:drop-shadow(0 0 10px rgba(var(--rgb),.35))}
.hollow text{font-family:var(--hd);font-size:40px;font-weight:700;letter-spacing:-1px;fill:none;stroke:url(#hg);stroke-width:1.5px;paint-order:stroke}
.hollow .s1{stop-color:var(--g1)}.hollow .s2{stop-color:var(--g2)}.hollow .s3{stop-color:var(--g3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:0 0 auto}
.chips.eq{display:grid;gap:6px;overflow:visible}
.chips.eq .chip{height:42px;padding:0 4px;border-radius:13px;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rowlbl{font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--dim);margin-bottom:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--hint);font-size:12.5px;white-space:nowrap}
.chip.on{border-color:var(--acc);background:rgba(var(--rgb),.14);color:var(--acc-xl);font-weight:600}
.vsep{width:1px;background:var(--line);align-self:stretch}
.cta{height:52px;border-radius:16px;border:0;background:var(--acc);color:var(--acc-ink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta.ghost{background:var(--card);border:1px solid var(--line);color:var(--acc-l);font-weight:600;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{text-align:left;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:3px}
.tile .a{font-size:11.5px;color:var(--hint)}
.tile .b{font-family:var(--hd);font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c{font-size:11.5px;color:var(--acc-l)}
.tile.bad .b{color:var(--bad-l)}
.list{border-radius:20px;border:1px solid var(--line);background:var(--card);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc-l)}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column}
.li .t b{font-size:14.5px;font-weight:600}
.li .t span{font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute)}
.sec{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--dim);margin:16px 4px 8px;display:flex;justify-content:space-between}
.sec i{font-style:normal;font-weight:500;letter-spacing:0;color:var(--acc-l)}
.sdesc{font-size:12.5px;color:var(--hint);margin:-4px 4px 8px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:0 16px 4px}
.subtabs::-webkit-scrollbar{display:none}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.row{position:relative;padding:14px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row.ch::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.rh{display:flex;align-items:center;gap:12px}
.rl{flex:1;min-width:0}
.rl b{display:block;font-size:15px;font-weight:700}
.rl span{display:block;font-size:12px;color:var(--hint);margin-top:1px}
.was{font-size:12px;color:var(--acc-l);margin-top:6px}
.warn{font-size:12px;color:var(--warn);margin-top:6px}
.warn.bad{color:var(--bad-l)}
.fld{height:44px;min-width:0;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:6px;font-size:12px;color:var(--dim);white-space:nowrap}
.fld:focus-within{border-color:var(--acc)}
.fld.err{border-color:var(--bad)}
.fld input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:15px;font-weight:600;text-align:right;outline:none;padding:0}
.fld input::placeholder{color:#55625f;font-weight:400}
.one{width:112px;flex-shrink:0}
.two{display:flex;align-items:center;gap:8px;margin-top:10px}
.two .fld{flex:1 1 0}
.two .dash{color:var(--mute)}
.bigv{font-family:var(--hd);font-size:20px;font-weight:700;color:var(--acc-l);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:10px 0 2px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) 0 var(--p,0%),#1a2423 var(--p,0%) 100%)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#1a2423}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
.seg{display:flex;padding:3px;gap:3px;border-radius:13px;background:var(--card2);border:1px solid var(--line);margin-top:10px}
.seg button{flex:1;height:36px;border-radius:10px;border:0;background:none;color:var(--hint);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--chip);color:var(--acc-xl);font-weight:700}
.sw{position:relative;width:50px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:#1d2a2a;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(20px)}
.swt{font-size:12.5px;color:var(--hint)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pc{padding:14px 16px;border-bottom:1px solid var(--line2)}
.pc:last-child{border-bottom:0}
.pc .pt{display:flex;align-items:center;gap:8px}
.pc .nm{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--acc);color:var(--acc-xl);background:rgba(var(--rgb),.12);white-space:nowrap}
.badge.del{border-color:var(--bad);color:var(--bad-l);background:rgba(248,113,113,.1)}
.pc .sm{font-size:12.5px;color:var(--hint);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{height:36px;border-radius:11px;padding:0 13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:13px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.red{border-color:#3d2422;color:var(--bad-l);background:#150c0b}
.ti{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;padding:0 12px;outline:none}
.ti:focus{border-color:var(--acc)}
.irow{display:flex;gap:8px;align-items:center;width:100%}
.ferr{font-size:12.5px;color:var(--bad-l);margin-top:6px}
.empty{padding:60px 18px;text-align:center;color:var(--hint)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.dock>*{pointer-events:auto}
.dockin{max-width:560px;margin:0 auto;padding:0 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.abar{display:none;gap:8px}
.abar.on{display:flex}
.abar .cta{height:50px;white-space:nowrap;font-size:15px}
.nav{height:62px;border-radius:22px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;padding:5px}
.nav button{position:relative;height:50px;border-radius:17px;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px}
.nav button.on{background:var(--chip);color:var(--acc-l);font-weight:600}
.nav .n{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--acc);color:var(--acc-ink);font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
.glass{background:rgba(14,21,21,.78);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.11);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 18px 50px rgba(0,0,0,.5)}
.pk{padding:6px}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:0;border-radius:16px;background:none;text-align:left}
.pkrow.on{background:rgba(var(--rgb),.14)}
.pkrow .t{flex:1;min-width:0}
.pkrow .t b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkrow .t span{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pkrow .ck{color:var(--acc);opacity:0;flex-shrink:0}
.pkrow.on .ck{opacity:1}
.pkrow+.pkrow{border-top:1px solid rgba(255,255,255,.055)}
.bars{padding:4px 0}
.bar{padding:10px 16px;border-bottom:1px solid var(--line2)}
.bar:last-child{border-bottom:0}
.bar .bt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar .bt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt span{font-family:var(--hd);font-weight:700;white-space:nowrap}
.bar .tr{height:6px;border-radius:3px;background:var(--card2);margin-top:7px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px;background:var(--mk)}
.chg{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(var(--rgb),.14);color:var(--acc-l)}
.chg.dn{background:rgba(248,113,113,.14);color:var(--bad-l)}
.sub2{font-size:13px;color:var(--hint)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:16px 0 4px}
.tiles.two2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:block;width:100%;text-align:left;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:14px 16px;margin-bottom:10px}
.opt.main{border-color:var(--acc);background:rgba(var(--rgb),.08)}
.opt .ot{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.opt .ot .ic{width:34px;height:34px}
.opt .od{font-size:12.5px;color:var(--hint);margin-top:6px;line-height:1.45}
.opt .seg{margin-top:12px}
.qrow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.qrow .qi{width:34px;height:34px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--acc-l);flex-shrink:0}
.qrow .qt{flex:1;min-width:0}
.qrow .qt b{display:block;font-size:14.5px}
.qrow .qt span{display:block;font-size:12px;color:var(--hint)}
.job{border-radius:20px;border:1px solid var(--hline);background:var(--card);padding:14px 16px;margin-bottom:12px}
.job .jh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--acc-l)}
.job .jt{font-size:15px;font-weight:700;margin-top:6px}
.job .js{font-size:13px;color:var(--hint);margin-top:4px;line-height:1.45;white-space:pre-line}
.job .jb{height:6px;border-radius:3px;background:var(--card2);margin-top:10px;overflow:hidden}
.job .jb i{display:block;height:100%;background:var(--mk);border-radius:3px}
.job .jf{font-size:11.5px;color:var(--dim);margin-top:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(var(--rgb),.6);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(var(--rgb),.55)}70%{box-shadow:0 0 0 8px rgba(var(--rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--rgb),0)}}
.chg-note{font-size:12.5px;color:var(--acc-l);margin:2px 2px 12px}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.fldw{width:100%;margin-top:10px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sh{border-bottom:0;background:rgba(12,18,18,.9);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sh h2{font-family:var(--hd);font-size:21px;margin:0 0 4px}
.sh .d{font-size:12.5px;color:var(--hint);margin-bottom:12px}
.ci{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.ci:last-child{border-bottom:0}
.ci .o{color:var(--dim);text-decoration:line-through;margin-right:6px}
.ci .n{color:var(--acc-l);font-weight:600}
.shb{display:flex;gap:8px;margin-top:14px}

/* ===== Спокойный стиль: плоские карточки, один акцентный цвет, стекло только у панели и шторок ===== */
body{background:transparent!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg) radial-gradient(70% 40% at 50% -8%,rgba(var(--rgb),.05),transparent 70%)}
/* Фон под сеть: бледный график (свечи / линия / соты), снизу ярче, к верху тает — текст не мешает */
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.35) 30%,#000 75%);mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.35) 30%,#000 75%)}
#bgfx svg{position:absolute;inset:0;width:100%;height:100%}
/* карточки над графиком — матовые: график под ними размыт, текст читается */
.card,.tile,.hero,.list,.x-card{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card,.tile{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.hero{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.hero .glow,.hero .dots{display:none}
.hero .mark{opacity:.13}
.glass{background:rgba(16,16,20,.72);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.35)}
.nav{border-radius:24px}
.nav button{border-radius:18px}
.nav button.on{background:rgba(255,255,255,.08);color:var(--text);box-shadow:none}
.nav button.on svg{color:var(--acc)}
.chip{background:transparent;border-color:rgba(255,255,255,.15);box-shadow:none;color:var(--hint)}
.chip.on{background:rgba(var(--rgb),.12);border-color:var(--acc);color:var(--text);box-shadow:none}
.cta{box-shadow:none}
.bar .tr i{background:var(--acc)}
.bar{border-bottom-color:rgba(255,255,255,.05)}
.hollow{filter:none}
.hollow text{stroke-width:1.3px}
.sec{font-size:13px;font-weight:600;letter-spacing:0;color:var(--hint);margin:20px 4px 8px}
.sdesc{font-size:12.5px;color:var(--dim)}
.lbl{font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--hint)}
.rowlbl{font-size:12px;font-weight:500;letter-spacing:0;color:var(--dim)}
.jh{letter-spacing:0;text-transform:none}
.tile .c{color:var(--hint)}
.tile .b,.big,.wkv,.bar .bt span{font-variant-numeric:tabular-nums}
.chg{background:none;padding:0;height:auto;font-weight:600}
.wkc i{background:rgba(255,255,255,.14)}
.wkc.on i{background:var(--acc)}
.wkc.part i{background:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,rgba(255,255,255,.05) 3px 6px)}
.sheet{background:rgba(0,0,0,.5);-webkit-backdrop-filter:none;backdrop-filter:none}

/* ===== 🧠 Стратегия ===== */
.x{--x-acc:var(--acc);--x-rgb:var(--rgb);--x-flip:#ffb547;--x-fliprgb:255,181,71;--x-warn:#f5c451;--x-bad:#ff6b6b;--x-line:rgba(255,255,255,.12);--x-card:rgba(255,255,255,.045)}
:root[data-theme="bsc"] .x{--x-flip:#a78bfa;--x-fliprgb:167,139,250}
.x button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.x-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x-back{width:38px;height:38px;border-radius:12px;border:1px solid var(--x-line)!important;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:20px!important}
.x-h{font-weight:700;font-size:24px;letter-spacing:-.3px;flex:1;min-width:0;font-family:var(--hd)}
.x-gp{border:1.5px solid var(--gc)!important;box-shadow:0 0 0 1px color-mix(in srgb, var(--gc) 18%, transparent) inset;margin-bottom:10px}
.x-gph{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:10px 2px 8px;border-bottom:1px solid color-mix(in srgb, var(--gc) 35%, transparent)}
.x-gph b{color:var(--gc);font-size:13.5px}
.x-gph span{color:var(--hint);font-size:12px}
.x-gpf{padding:9px 2px 11px;font-size:12.5px;color:var(--hint);border-top:1px solid color-mix(in srgb, var(--gc) 25%, transparent)}
.x-gpf b{color:var(--gc)}
.x-gma{color:var(--acc);text-decoration:none;font-weight:600}
.x-gma:hover{text-decoration:underline}
.x-pill{font-size:12.5px;color:var(--hint);border:1px solid var(--x-line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.x-card{display:block;width:100%;background:var(--x-card);border:1px solid var(--x-line)!important;border-radius:18px;padding:14px}
.x-vd.x-w{border-color:rgba(245,196,81,.35)!important;background:rgba(245,196,81,.06)}
.x-vd.x-g{border-color:rgba(var(--x-rgb),.35)!important;background:rgba(var(--x-rgb),.06)}
.x-vd.x-b{border-color:rgba(255,107,107,.35)!important;background:rgba(255,107,107,.06)}
.x-vt{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:flex-start}
.x-vs{color:var(--hint);font-size:13px;margin-top:6px}
.x-sec{font-size:13px;font-weight:600;color:var(--hint);margin:18px 4px 8px}
.x-mode{margin-bottom:10px;position:relative}
.x-mode.x-win{border-color:rgba(var(--x-rgb),.45)!important}
.x-mh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hint);padding-right:104px;white-space:nowrap;overflow:hidden}
.x-mh b{color:var(--text);font-size:14.5px}
.x-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.x-big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.x-row{display:flex;gap:6px 14px;font-size:12.5px;color:var(--hint);flex-wrap:wrap}
.x-row b{color:var(--text);font-weight:600}
.x-ok{color:var(--x-acc)!important}.x-bad{color:var(--x-bad)!important}
.x-tag{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--x-warn);background:rgba(245,196,81,.08);border-radius:8px;padding:5px 8px}
.x-spark{position:absolute;right:14px;top:30px;width:96px;height:40px}
.x-chev{position:absolute;right:14px;bottom:14px;color:var(--dim)}
.x-list{padding:2px 14px}
.x-it{display:grid!important;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;padding:11px 2px!important;border-bottom:1px solid rgba(255,255,255,.08)!important;font-size:13.5px;width:100%}
.x-it:last-child{border-bottom:0!important}
.x-it.x-iw{grid-template-columns:30px 1fr auto auto}
/* значок кошелька: узор 5×5 из адреса, цвет — тип стратегии */
.x-idn{display:block;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--ic) 12%,transparent);fill:var(--ic);shape-rendering:crispEdges}
.x-m{font-size:12px;color:var(--dim)}
.x-num{font-variant-numeric:tabular-nums;font-weight:600}
.x-note{font-size:12.5px;color:var(--dim);margin:10px 4px 0}
.x-btn{display:flex!important;align-items:center;justify-content:center!important;gap:8px;height:50px;border-radius:14px;font-weight:600;font-size:14.5px;width:100%;text-align:center!important}
.x-ghost{border:1px solid var(--x-line)!important}
.x-solid{background:var(--acc)!important;color:var(--acc-ink)!important}
.x-tabs{display:flex;gap:6px;margin-bottom:12px}
.x-tab{flex:1 1 0;min-width:0;text-align:center!important;font-size:13px;padding:8px 2px!important;border-radius:11px;border:1px solid var(--x-line)!important;color:var(--hint)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-tab.on{border-color:var(--mc)!important;color:var(--text)!important;background:rgba(var(--mrgb),.10)!important}
.x-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.x-tile{background:var(--x-card);border:1px solid var(--x-line);border-radius:14px;padding:10px}
.x-tile .x-k{font-size:11.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-tile .x-v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.x-s{display:grid!important;grid-template-columns:auto minmax(0,1fr) 32px;align-items:center;gap:8px;padding:10px 14px!important;border-bottom:1px solid rgba(255,255,255,.08)!important;font-size:13.5px;width:100%}
.x-s:last-child{border-bottom:0!important}
.x-s .x-k{color:var(--hint);white-space:nowrap}
.x-s .x-v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.x-s .x-v.x-off{color:var(--dim);font-weight:500}
.x-cp{width:32px;height:32px;border-radius:9px;border:1px solid var(--x-line);display:flex;align-items:center;justify-content:center;color:var(--hint)}
.x-s.done .x-cp{color:var(--x-acc);border-color:rgba(var(--x-rgb),.5)}
.x-in{width:100%;height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--x-line);background:rgba(255,255,255,.03);color:var(--text);font:600 14px var(--hd);padding:0 12px;outline:none}
.x-in.x-ta{height:auto;min-height:46px;max-height:180px;padding:12px;resize:none;overflow:hidden;scrollbar-width:none;line-height:1.4;font:600 13px var(--hd);word-break:break-all}
.x-in:focus,.x-fl input:focus{border-color:rgba(var(--x-rgb),.6)}
.x-in.x-ta::-webkit-scrollbar{display:none}
/* поле адреса + кнопка «Вставить» внутри справа */
.x-inw{position:relative;margin-top:10px}.x-inw .x-in{margin-top:0;padding-right:112px}
.x-paste{position:absolute;right:6px;top:6px;height:34px;padding:0 11px;border-radius:9px!important;display:flex;align-items:center;gap:6px;
  background:rgba(var(--x-rgb),.12)!important;border:1px solid rgba(var(--x-rgb),.4)!important;color:var(--acc-l)!important;font:600 12.5px Onest,system-ui,sans-serif!important}
.x-paste svg{flex:0 0 auto}
.x-in.x-ta::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chips{display:flex;gap:6px;margin-top:8px}
.x-chip{flex:1;height:36px;border-radius:11px;border:1px solid var(--x-line)!important;color:var(--hint)!important;text-align:center!important;font-size:13px}
.x-chip.on{border-color:var(--acc)!important;color:var(--text)!important;background:rgba(var(--x-rgb),.12)!important}
.x-link{color:var(--acc)!important;text-decoration:underline}
.x-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.x-f.qf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}.x-f.qf input{height:38px;font-size:14px}
/* окно расширения: без нижней панели вкладок — только стратегия, больше места под таблицу */
body.ext .dock{display:none!important}body.ext #app{padding-bottom:40px!important}
.x-fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--hint)}
.x-fl input{height:44px;border-radius:12px;border:1px solid var(--x-line);background:rgba(255,255,255,.03);color:var(--text);font:600 15px var(--hd);padding:0 12px;width:100%;outline:none}
.x-tg{display:flex!important;align-items:center;justify-content:space-between;padding:12px 14px!important;border-bottom:1px solid rgba(255,255,255,.08)!important;font-size:14px;width:100%}
.x-tg:last-child{border-bottom:0!important}
.x-sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;flex:0 0 44px}
.x-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.x-sw.on{background:var(--acc)}.x-sw.on::after{left:21px}
.x-tw{padding:0!important;overflow-x:auto;-webkit-overflow-scrolling:touch}
.x-tb{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.x-tb th{position:sticky;top:0;font-size:12.5px;font-weight:600;color:var(--hint);text-align:right;padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;cursor:pointer;background:#0c0b12}
.x-tb th.on{color:var(--text)}
.x-tb td{padding:13px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08)}
.x-tb tr:last-child td{border-bottom:0}
.x-tb .x-st{position:sticky;left:0;text-align:left;background:#0c0b12;z-index:1;box-shadow:1px 0 0 rgba(255,255,255,.06)}
.x-tb tr.w .x-st{box-shadow:inset 3px 0 0 rgba(var(--x-rgb),.7),1px 0 0 rgba(255,255,255,.06)}
.x-tb tr.l .x-st{box-shadow:inset 3px 0 0 rgba(255,107,107,.6),1px 0 0 rgba(255,255,255,.06)}
.x-tb tr.o td{opacity:.65}
.x-tk{display:flex;align-items:center;gap:8px}
.x-chk{width:20px;height:20px;flex:0 0 auto;margin:0;accent-color:var(--acc);cursor:pointer}
.x-tb tr.xx td{opacity:.38}
.x-tb tr.xx td.x-st{opacity:1}
.x-tb tr.xx .x-tl{text-decoration:line-through;opacity:.5}
.x-exb{margin:0 0 10px;font-size:13.5px}
.x-exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.x-exh .x-link{font-size:12.5px}
.x-exr{margin-top:4px}
.x-exc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.x-tl{color:var(--text)!important;font-weight:700;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px}
.x-ca{width:30px;height:30px;border-radius:9px;border:1px solid var(--x-line)!important;color:var(--hint)!important;text-align:center!important;font-size:12px}
.xq-tip{position:absolute;z-index:3;background:#16141d;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 9px;font-size:11.5px;line-height:1.45;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;color:var(--text)}
.xq-tip b{font-size:12px}
.xq-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--hint);margin-top:6px;flex-wrap:wrap}.xq-row b{color:var(--text)}
.x-new{font-style:normal;font-size:10px;font-weight:700;color:var(--x-acc);background:rgba(var(--x-rgb),.12);padding:1px 5px;border-radius:5px}
@media (min-width:900px){
  body.wide[data-scr="strat"] .app{max-width:1240px}
  body.wide .dockin{max-width:1240px}
  .x-tw{overflow-x:auto}
  .x-tb{width:max-content;min-width:100%}
  .x-list{max-height:none}
}
.dk,.dl,.dr,.dkg,.dgi{display:block}
@media (min-width:900px){
  body.wide .app{max-width:1180px;padding-left:28px;padding-right:28px}
  body.wide .dockin{max-width:720px}
  body[data-scr="strat"] .dockin{max-width:720px}
  .dk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .dk > .dr > .sec:first-child,.dk > .dl > .sec:first-child{margin-top:0}
  .dk > .dr > .tiles:first-child{margin-top:0}
  .dkf{grid-template-columns:240px minmax(0,1fr)}
  .dkf .subtabs{flex-direction:column;overflow:visible;margin:0;padding:0;position:sticky;top:12px}
  .dkf .subtabs .chip{text-align:left;justify-content:flex-start;height:44px;padding:0 14px}
  .dkf > .dr > .sec:first-child{margin-top:0}
  .dkg{columns:2;column-gap:22px}
  .dgi{break-inside:avoid;display:inline-block;width:100%}
  .dgi > .sec:first-child{margin-top:4px}
  body[data-scr="home"] .hero{min-height:0}
}
@media (min-width:1180px){
  .x-2{display:grid;grid-template-columns:minmax(380px,440px) minmax(0,1fr);gap:22px;align-items:start}
  .x-r > .x-sec:first-child{margin-top:0}
  .x-2 > .x-r{position:sticky;top:12px}
  .x-btl{grid-template-rows:auto 1fr}
  .x-btl .x-btres{grid-column:2;grid-row:1;position:static}
  .x-btl .x-btform{grid-column:1;grid-row:1 / span 2}
  .x-btl .x-bttab{grid-column:2;grid-row:2;position:static}
}

/* ===== Моно для мелких цифр: таблицы, суммы, адреса. Крупные цифры остаются на Onest ===== */
:root{--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.x-tb td,.x-num,.x-gma,.x-s .x-v,.ci .o,.ci .n,.chg,.bar .bt span,.xq-row b,.xq-tip,.ocbar span{font-family:var(--mono);letter-spacing:-.3px}
.x-tb td,.x-num,.bar .bt span{font-weight:500}
/* прогресс из 20 сегментов — одинаково на телефоне и ПК, без символов-блоков */
.seg{display:flex;gap:2px;margin-top:10px}
.seg i{flex:1;height:6px;border-radius:1.5px;background:rgba(255,255,255,.08)}
.seg i.on{background:var(--acc)}
/* спиннер «бот работает» */
.spin{display:inline-block;width:10px;font-family:var(--mono);color:var(--acc);line-height:1}
@media (prefers-reduced-motion:reduce){.seg i{transition:none}}
/* PnL по дням */

function xTwInit(){

    const w = document.createElement("div"); w.className = "x-twr";
    tw.parentNode.insertBefore(w, tw); w.appendChild(tw);
    w.insertAdjacentHTML("beforeend", '<button type="button" class="x-twb l" aria-label="Листать влево">‹</button><button type="button" class="x-twb r" aria-label="Листать вправо">›</button>');
    const upd = () => { const max = tw.scrollWidth - tw.clientWidth; w.classList.toggle("canl", tw.scrollLeft > 2); w.classList.toggle("canr", tw.scrollLeft < max - 2); };
    tw.addEventListener("scroll", upd, {passive: true}); upd();
    try { new ResizeObserver(upd).observe(tw); } catch (e) {}
    w.querySelector(".l").addEventListener("click", e => { e.stopPropagation(); tw.scrollBy({left: -tw.clientWidth * .7, behavior: "smooth"}); });
    w.querySelector(".r").addEventListener("click", e => { e.stopPropagation(); tw.scrollBy({left: tw.clientWidth * .7, behavior: "smooth"}); });
    // перетаскивание мышью (на телефоне палец листает и так)
    let sx = 0, sl = 0, moved = false;
    const move = e => { const dx = e.clientX - sx; if (!moved && Math.abs(dx) > 5){ moved = true; tw.classList.add("drag"); } if (moved) tw.scrollLeft = sl - dx; };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); tw.classList.remove("drag"); if (moved){ tw._noClick = true; setTimeout(() => tw._noClick = false, 0); } };
    tw.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse" || e.button !== 0 || tw.scrollWidth <= tw.clientWidth) return;
      if (e.target.closest("button,input,a,label")) return;
      sx = e.clientX; sl = tw.scrollLeft; moved = false;
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
    // после перетаскивания клик не считается (иначе сработала бы сортировка по заголовку)
    tw.addEventListener("click", e => { if (tw._noClick){ e.stopPropagation(); e.preventDefault(); tw._noClick = false; } }, true);
  });
}

document.addEventListener("click", async e => {
  if (screen !== "strat") return;
  const t = e.target;
  if (t.closest("[data-xre]")){ ST.err = ""; ST.list = null; stLoad(true); render(true); return; }
  if (t.closest("[data-xpaste]")){ xPaste(); return; }
  const per = t.closest("[data-xper]"); if (per){ ST.per = per.dataset.xper; render(true); return; }
  if (t.closest("[data-xrun]")){
    const raw = ((document.getElementById("xaddr") || {}).value || ST.addr).trim(), ws = xParseW(raw);
    if (!ws.length){ xToast("Вставь адрес или ссылку GMGN"); return; }
    const a = ws.length > 1 || raw !== ws[0] ? raw : ws[0];   // сервер сам разберёт ссылки и пачку
    const chain = ws[0].startsWith("0x") ? (cur["m.chain"] !== "sol" && cur["m.chain"] !== "all" ? cur["m.chain"] : "bsc") : "sol";
    if (P.sa && P.sk){ stRun(a, chain); return; }
    const out = {v: 3, run: "strategy", addr: a, period: ST.per, chain};   // сервера нет — через чат, как раньше
    if (inTG && tg.sendData) tg.sendData(JSON.stringify(out)); else alert(JSON.stringify(out));
    return;
  }
  const so = t.closest("[data-xsort]"); if (so){ const k = so.dataset.xsort; xDir = xSort === k ? -xDir : -1; xSort = k; render(true); return; }
  const fl = t.closest("[data-xflt]"); if (fl){ xFlt = fl.dataset.xflt; render(true); return; }
  const ca = t.closest("[data-xca]"); if (ca){ await xCopy(ca.dataset.xca); xToast("Адрес токена скопирован"); return; }
  if (t.closest("[data-xbad]")){ xShowBad = !xShowBad; render(true); return; }
  if (t.closest("[data-xall]")){ xAll = !xAll; render(true); return; }
  const tk = t.closest("[data-xtok]");
  if (tk){ const D = xD(); const url = `https://gmgn.ai/${D.c}/token/${tk.dataset.xtok}?maker=${D.a}`;
    try { inTG && tg.openLink ? tg.openLink(url) : window.open(url, "_blank"); } catch (e) { window.open(url, "_blank"); } return; }
  if (t.closest("[data-xexcel]")){
    const D = xD(); xToast("Собираю Excel…");
    try {
      const r = await (await fetch(`${P.sa}/api/excel?k=${encodeURIComponent(P.sk)}&a=${encodeURIComponent(D.a)}&p=${D.p}`, {cache: "no-store"})).json();
      xToast(r.r === "ok" ? "Excel отправлен в чат" : r.r === "old" ? "Бот перезапускали — запусти поиск заново, тогда будет Excel" : "Не получилось отправить");
    } catch (e) { xToast("Сервер бота не отвечает"); }
    return;
  }
  if (t.closest("[data-xbuyed]")){ e.preventDefault(); e.stopPropagation(); xBuyOpen = !xBuyOpen; render(true); setTimeout(() => { const i = document.getElementById("xbuyin"); if (i) i.focus(); }, 50); return; }
  if (t.closest("[data-xbuysave]")){ xBuySave(); return; }
  if (t.closest("#xbuyf")) return;
  const bzb = t.closest("[data-xbzbt]"); if (bzb){ const D1 = xD(), r1 = xBz(D1); if (r1 && r1.p){ ST.bt = xParamsToB(r1.p); ST.v = "bt"; render(); window.scrollTo(0, 0); xToast("Настройки из Blizz → бэктест"); } return; }
  const bz = t.closest("[data-xblz]"); if (bz){ xBlizzSend(bz.dataset.xblz, !!bz.dataset.xblzupd); return; }
  const xe = t.closest("[data-xex]"); if (xe){ const D0 = xD(); if (D0){ const S = xExSet(D0), a = xe.dataset.xex; S.has(a) ? S.delete(a) : S.add(a); render(true); } return; }
  if (t.closest("[data-xexclr]")){ if (ST.ex) ST.ex.set.clear(); render(true); return; }
  const xa = t.closest("[data-xexap]"); if (xa && ST.exC){ const c = ST.exC[+xa.dataset.xexap]; if (c){ ST.bt = xParamsToB(c.p); ST.v = "bt"; if (ST.ex) ST.ex.set.clear(); render(); window.scrollTo(0, 0); xToast(c.lbl + " → " + c.val); } return; }
  if (t.closest("[data-xgm]")) return;   // тап по адресу — это ссылка на GMGN, а не открытие поиска
  const xc = t.closest("[data-xcal]"); if (xc && ST.cal){ const i = +xc.dataset.xcal; ST.cal.i = ST.cal.i === i ? null : i; render(true); return; }
  const it = t.closest("[data-xi]"); if (it){ stOpenItem(+it.dataset.xi); render(); window.scrollTo(0, 0); return; }
  const o = t.closest("[data-xo]"); if (o){ const [m, k] = o.dataset.xo.split(":"); ST.m = m; ST.k = +k; ST.v = "detail"; ST.bt = null; render(); window.scrollTo(0, 0); return; }
  const b = t.closest("[data-xb]"); if (b){ ST.v = b.dataset.xb; render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-xbt]")){ const D0 = xD(), sv = D0 && xMemLoad(D0);   // свой сетап этого варианта — как оставил
    ST.bt = sv && sv.bt && sv.m === ST.m && sv.k === ST.k ? sv.bt : null; ST.v = "bt"; render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-xbthome]")){ const D0 = xD(), sv = D0 && xMemLoad(D0);
    if (sv && sv.bt && D0.m[sv.m] && D0.m[sv.m].v[sv.k]){ ST.m = sv.m; ST.k = sv.k; ST.bt = sv.bt; }
    else { const pk = D0.pk || {}; ST.m = pk.m === "flip" && D0.m.f ? "f" : "n"; ST.k = (D0.m[ST.m] && D0.m[ST.m].r) || 0; ST.bt = null; }
    ST.v = "bt"; render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-xbtreset]")){ ST.bt = null; render(true); return; }
  const sw = t.closest("[data-xsw]"); if (sw && ST.bt){ ST.bt[sw.dataset.xsw] = ST.bt[sw.dataset.xsw] ? 0 : 1; render(true); return; }
  const cp = t.closest("[data-xcp]"); if (cp){ const r = stCurRows()[+cp.dataset.xcp]; if (r){ await xCopy(r[1].replace(/\s*\(~\$[^)]*\)/, "").replace(/\s*\(только Jito\)/, "")); cp.classList.add("done"); xToast("Скопировано: " + r[0]); } return; }
  if (t.closest("[data-xcpall]")){ await xCopy(stCurRows().map(r => r[0] + ": " + r[1]).join("\n")); xToast("Все настройки скопированы"); }
});
try { inTG && tg.BackButton.onClick(() => { if (!document.getElementById("sheet").classList.contains("on")) setTimeout(stBack, 0); }); } catch (e) {}

</script>
